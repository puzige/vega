<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Vega R17 Smile logo, light appearance</title>
  <desc>Connected terminal chevron, one slender four-point star, and a shallow smiling cursor on a sapphire light tile.</desc>
  <defs>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F4FA"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#438FF6"/>
      <stop offset="0.52" stop-color="#3478D8"/>
      <stop offset="1" stop-color="#245AAF"/>
    </linearGradient>
    <linearGradient id="sapphire-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D0E7FF"/>
      <stop offset="0.52" stop-color="#6FA8EE"/>
      <stop offset="1" stop-color="#174C9E"/>
    </linearGradient>
  </defs>

  <!-- R17: the tile is exactly 832px centered in a transparent 1024px canvas. -->
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#tile-light)"/>
  <rect x="98" y="98" width="828" height="828" rx="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="4"/>

  <!-- The three paths below are the canonical R17 geometry. Keep them in sync with
       the dark and mono variants; color and contact shadows are appearance-only. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Same-path rim pass: a restrained contour bevel, not an interior glyph. -->
    <path d="M316 316 L512 512 L316 686" stroke="url(#sapphire-rim)" stroke-opacity="0.34" stroke-width="94"/>
    <path d="M473 727 Q586 757 702 727" stroke="url(#sapphire-rim)" stroke-opacity="0.34" stroke-width="60"/>

    <!-- Close contact shadows add shallow relief without SVG filter support. -->
    <path d="M316 316 L512 512 L316 686" stroke="#7189B0" stroke-opacity="0.14" stroke-width="96" transform="translate(0 5)"/>
    <path d="M686 371
      C674 411 670 425 658 436
      C647 446 633 450 617 456
      C633 462 647 466 658 476
      C670 487 674 501 686 540
      C698 501 702 487 714 476
      C725 466 739 462 754 456
      C739 450 725 446 714 436
      C702 425 698 411 686 371 Z" fill="#7189B0" fill-opacity="0.1" stroke="none" transform="translate(0 5)"/>
    <path d="M473 727 Q586 757 702 727" stroke="#7189B0" stroke-opacity="0.14" stroke-width="60" transform="translate(0 5)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- connected terminal prompt -->
    <path d="M316 316 L512 512 L316 686" stroke="url(#sapphire)" stroke-width="90"/>
    <!-- one slender, curved-sided four-point star -->
    <path d="M686 371
      C688 371 689 373 690 377
      C698 409 702 425 714 436
      C725 446 738 450 751 454
      C755 455 755 457 751 458
      C738 462 725 466 714 476
      C702 487 698 503 690 534
      C689 538 688 540 686 540
      C684 540 683 538 682 534
      C674 503 670 487 658 476
      C647 466 634 462 621 458
      C617 457 617 455 621 454
      C634 450 647 446 658 436
      C670 425 674 409 682 377
      C683 373 684 371 686 371 Z" fill="url(#sapphire)" stroke="url(#sapphire-rim)" stroke-opacity="0.34" stroke-width="3"/>

    <!-- shallow upward cursor / smile -->
    <path d="M473 727 Q586 757 702 727" stroke="url(#sapphire)" stroke-width="56"/>
  </g>
</svg>
