[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[dependencies]
ring = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# exec-guide §5 whitelist: anyhow is xtask-only; serde/serde_json serialize
# the bench report JSON.
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# dependencies only (no new third-party crate enters the graph; Cargo.lock
# the C1 milestone must be flushed from a pinned GPUI next-frame callback
# inside an isolated release subprocess (SDD §2/C1), which is impossible
# without naming gpui; the real root view (Sidebar + routed
# ConversationStream + enabled Composer) is composed from the production
# vega_ui/vega_theme crates; the preseeded isolated profile (SDD §3/C2/C3)
# is seeded through the public vega_store/vega_conversation APIs. Production
# code under crates/ is NOT touched by this card.
gpui_kit = { workspace = true }
vega_store = { workspace = true }
vega_conversation = { workspace = true }
vega_theme = { workspace = true }
vega_ui = { workspace = true }
