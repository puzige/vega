# PR check + master build pipeline for Vega (macOS arm64).
#
# ── Design notes ─────────────────────────────────────────────────────────────
# - This repo is PUBLIC: GitHub-hosted runners (including macos-latest) are
#   free and do not consume the minute quota. The old "PRIVATE / 10x cost"
#   warning in release.yml is obsolete.
# - Gate placement (2026-09-22 owner decision, issue #123): all verification
#   lives here, in the cloud. Local git hooks and the Python verifier
#   (scripts/verify.py, cargo-lock/cargo-coordinate) were removed so a
#   developer's commit/push never blocks on machine performance.
# - Standard Cargo steps, no bespoke Python: fmt -> clippy -> test on PRs;
#   package on master. `dtolnay/rust-toolchain` follows rust-toolchain.toml
#   (1.98.0) so local and CI toolchains match.
# - master is protected (PR-only): the `push` trigger below fires after a PR
#   merge and produces the packaged bundle as a downloadable artifact. It does
#   NOT publish a Release — releases stay tag-driven (release.yml) so not every
#   commit becomes a version.
#
# ── Required status check ────────────────────────────────────────────────────
# Enable branch protection (Settings -> Branches) requiring the `check` job and
# "Require a pull request before merging". That is an admin action and is not
# done by this workflow.

name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel a superseded run for the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (fmt, clippy, test)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest # arm64, matches local; free for public repos
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain (rust-toolchain.toml = 1.98.0)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: build (master)
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain (rust-toolchain.toml = 1.98.0)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build the bundle (cargo xtask package)
        # Assembles dist/Vega.app, ad-hoc signs it and zips
        # dist/Vega-macos-arm64.zip. Version falls back to Cargo.toml (no tag).
        run: cargo xtask package

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: Vega-macos-arm64-master
          path: dist/Vega-macos-arm64.zip
          if-no-files-found: error
