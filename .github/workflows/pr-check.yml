# PR check pipeline for Vega (macOS arm64) — pull requests only.
#
# ── Design notes ─────────────────────────────────────────────────────────────
# - This repo is PUBLIC: GitHub-hosted runners (including macos-latest) are
#   free and do not consume the minute quota.
# - Split out of the former single ci.yml (2026-09-22 owner decision): PR gating
#   and the master build are now two independent pipelines so a master build
#   never re-runs the fmt/clippy/test gate and a PR never queues behind a build.
#   The two files deliberately share one cargo cache key (`shared-key: vega`) so
#   a PR restores the dependency cache written by the master build — see below.
# - Gate placement (2026-09-22 owner decision, issue #123): all verification
#   lives here, in the cloud. Local git hooks and the Python verifier
#   (scripts/verify.py, cargo-lock/cargo-coordinate) were removed so a
#   developer's commit/push never blocks on machine performance.
# - Standard Cargo steps: quality checks and four test shards run in parallel.
#   `dtolnay/rust-toolchain` follows rust-toolchain.toml (1.98.0) so local and CI
#   toolchains match.
# - Tests run under `cargo-nextest` (2026-09-22 owner decision, option B): each
#   test gets its own process and timeout, so a hang fails fast with a named test
#   instead of stalling the job, and the per-test progress makes the slow suite
#   legible. Same binaries, same assertions, no code change. nextest does NOT
#   run doc-tests, so they stay as an explicit `cargo test --doc` step.
#   Retries stay 0 (.config/nextest.toml): this repo forbids auto-retrying a
#   flake to green — a flaky test is quarantined via `#[ignore]` + R52 instead.
#
# ── Required status check ────────────────────────────────────────────────────
# Branch protection requires the job context "check (fmt, clippy, test)". Do not
# rename the job without updating Settings -> Branches, or merges will block.

name: pr-check

on:
  pull_request:
    branches: [master]

# Cancel a superseded run for the same ref (e.g. rapid PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (fmt, clippy, doc-tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vega
          save-if: false

      - name: Test shadow selector
        run: python3 -m unittest discover -s .github/ci -p 'test_test_selection.py' -v

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Doc-tests
        # nextest does not run doc-tests; keep their coverage explicit.
        run: cargo test --workspace --doc

  test:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shadow diff includes the base and merge checkout; execution stays full.
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # All shards inherit the master build's dependency cache, read-only.
          shared-key: vega
          save-if: false

      - name: Explain test selection (shadow only)
        if: ${{ matrix.shard == 1 }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/ci/test_selection.py --base "$BASE_SHA" --head "$(git rev-parse HEAD)" --output test-selection-shadow.json
          cat test-selection-shadow.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shadow selection report
        if: ${{ always() && matrix.shard == 1 }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-selection-shadow
          path: |
            test-selection-shadow.json
            test-selection-shadow.md
          if-no-files-found: warn

      - name: Test (cargo-nextest)
        # Hash partitions cover the same suite once; retries remain disabled.
        run: cargo nextest run --workspace --partition hash:${{ matrix.shard }}/4

  check:
    name: check (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, test]
    if: ${{ always() }}
    steps:
      - name: Require every quality check and test shard to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
