name: pr-check

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vega-master-build
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  nextest:
    name: Nextest
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install the pinned nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vega-master-build
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Test the workspace
        run: cargo nextest run --workspace

  check:
    name: check (fmt, clippy, test)
    needs: [clippy, nextest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          NEXTEST_RESULT: ${{ needs.nextest.result }}
        run: |
          if [[ "$CLIPPY_RESULT" != "success" || "$NEXTEST_RESULT" != "success" ]]; then
            echo "Clippy: $CLIPPY_RESULT; Nextest: $NEXTEST_RESULT"
            exit 1
          fi
