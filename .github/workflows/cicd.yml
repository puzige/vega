name: master

on:
  push:
    branches: [master]

concurrency:
  group: vega-master-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: publish merged master
    uses: ./.github/workflows/release.yml
    with:
      automatic: true
      target_sha: ${{ github.sha }}
    secrets: inherit
