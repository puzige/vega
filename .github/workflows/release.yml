name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  workflow_call:
    inputs:
      automatic:
        type: boolean
        default: false
      target_sha:
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: build & publish (macos-latest, arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: vega-stable-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout fixed release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Reserve release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ inputs.automatic && 'true' || 'false' }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          git fetch origin master --tags
          python3 scripts/release.py prepare

      - name: Inspect signing configuration
        if: steps.plan.outputs.complete != 'true'
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" == 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing credentials absent: publishing ad-hoc package; automatic installation disabled."
          elif [[ "$configured" == 6 ]]; then
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Invalid signing Team ID"; exit 1; }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing credentials are incomplete; refusing to publish."
            exit 1
          fi

      - name: Install the pinned toolchain
        if: steps.plan.outputs.complete != 'true'
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo build
        if: steps.plan.outputs.complete != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vega-master-build
          save-if: ${{ inputs.automatic == true }}

      - name: Build the bundle
        if: steps.plan.outputs.complete != 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.tag }}
        run: cargo xtask package --version "${RELEASE_VERSION#v}"

      - name: Sign, notarize, staple and repack
        if: steps.plan.outputs.complete != 'true' && steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/vega-signing.XXXXXX")
          keychain="$signing_dir/build.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$signing_dir/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain" > "$signing_dir/identities.txt"
          identity=$(python3 - "$signing_dir/identities.txt" <<'PY'
          import os, re, sys
          text = open(sys.argv[1]).read()
          team = re.escape(os.environ['APPLE_TEAM_ID'])
          identities = re.findall(r'\b([0-9A-Fa-f]{40}) "Developer ID Application: [^"\n]+ \(' + team + r'\)"', text)
          if len(identities) != 1:
              sys.exit('Expected exactly one Developer ID Application identity for configured team')
          print(identities[0])
          PY
          )
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" dist/Vega.app
          codesign --verify --deep --strict dist/Vega.app
          codesign -dv --verbose=4 dist/Vega.app 2> "$signing_dir/signature.txt"
          python3 - "$signing_dir/signature.txt" <<'PY'
          import os, sys
          lines = open(sys.argv[1]).read().splitlines()
          if 'TeamIdentifier=' + os.environ['APPLE_TEAM_ID'] not in lines:
              sys.exit('Signed Team ID mismatch')
          if 'Identifier=ai.vega' not in lines:
              sys.exit('Signed bundle ID mismatch')
          if not any(line.startswith('Authority=Developer ID Application:') for line in lines):
              sys.exit('Developer ID authority missing')
          PY
          rm dist/Vega-macos-arm64.zip
          (cd dist && zip -r -q -X Vega-macos-arm64.zip Vega.app INSTALL.txt)
          xcrun notarytool submit dist/Vega-macos-arm64.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 20m --output-format json > "$signing_dir/notary.json"
          python3 - "$signing_dir/notary.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1])).get('status') != 'Accepted':
              sys.exit('Notarization was not accepted; refusing to publish')
          PY
          xcrun stapler staple dist/Vega.app
          xcrun stapler validate dist/Vega.app
          codesign --verify --deep --strict dist/Vega.app
          spctl --assess --type execute dist/Vega.app
          rm dist/Vega-macos-arm64.zip
          (cd dist && zip -r -q -X Vega-macos-arm64.zip Vega.app INSTALL.txt)
          mkdir "$signing_dir/unpacked"
          unzip -q dist/Vega-macos-arm64.zip -d "$signing_dir/unpacked"
          xcrun stapler validate "$signing_dir/unpacked/Vega.app"
          codesign --verify --deep --strict "$signing_dir/unpacked/Vega.app"
          spctl --assess --type execute "$signing_dir/unpacked/Vega.app"
          (cd dist && shasum -a 256 Vega-macos-arm64.zip > Vega-macos-arm64.zip.sha256)

      - name: Attach the artifact
        if: steps.plan.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vega-macos-arm64
          path: |
            dist/Vega-macos-arm64.zip
            dist/Vega-macos-arm64.zip.sha256
          if-no-files-found: error

      - name: Publish complete draft
        if: steps.plan.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.sha }}
        run: python3 scripts/release.py publish
