[package]
name = "vega_ui"
version.workspace = true
edition.workspace = true

[features]
nsh-reading-integration = ["gpui_kit/test-support", "nsh-platform-gpui/vega-host-regressions"]

[dependencies]
vega_i18n.workspace = true
gpui_kit.workspace = true
nsh-platform-gpui.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
libc.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
vega_store.workspace = true
vega_conversation.workspace = true
vega_theme.workspace = true
# vega_ui ─▶ vega_markdown）；serde_json 供 bench 自测量模式输出 JSON 报告
# （exec-guide §5 白名单内依赖）。
vega_markdown.workspace = true
serde_json.workspace = true

[[test]]
name = "nsh_reading_geometry"
harness = false

[[test]]
name = "nsh_reading_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_scroll_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_icons_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_settings_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_recovery_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_message_anchors_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_palette_integration"
harness = false
required-features = ["nsh-reading-integration"]

[[test]]
name = "nsh_ordinary_controls_integration"
harness = false
required-features = ["nsh-reading-integration"]

[dev-dependencies]
gpui_kit = { workspace = true, features = ["test-support"] }
nsh-platform-gpui = { workspace = true, features = ["vega-host-regressions"] }
