[package]
name = "vega"
version.workspace = true
edition.workspace = true

[features]
nsh-workspace-integration = ["gpui_kit/test-support"]

[[test]]
name = "nsh_workspace_mounted"
path = "src/window/nsh_workspace/mounted_main.rs"
harness = false
required-features = ["nsh-workspace-integration"]

[dependencies]
vega_i18n.workspace = true
vega_credentials = { workspace = true }
gpui_kit.workspace = true
gpui-fast.workspace = true
gpui-fast-platform.workspace = true
nsh-platform-gpui.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
pulldown-cmark.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ring.workspace = true
base64.workspace = true
reqwest.workspace = true
zip.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tokio-util.workspace = true
vega_conversation.workspace = true
vega_runtime.workspace = true
vega_store.workspace = true
vega_theme.workspace = true
vega_tools.workspace = true
vega_ui.workspace = true
vega_acp.workspace = true
ulid.workspace = true
