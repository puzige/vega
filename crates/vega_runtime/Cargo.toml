[package]
name = "vega_runtime"
version.workspace = true
edition.workspace = true

[dependencies]
vega_credentials = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "sync"] }
tokio-util = { workspace = true }   # CancellationToken（tech-spec §4.1 cancel 参数）
futures = { workspace = true }      # BoxFuture/Stream 组合子（手工装箱 trait，零 async-trait）
reqwest = { workspace = true }      # rustls + json + stream（bytes_stream 供 SSE 解析）
eventsource-stream = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
vega_tools = { workspace = true }
vega_mcp = { workspace = true }
vega_token = { workspace = true }
# Existing ULID facility used for durable compaction attempt identity.
ulid = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }

[dev-dependencies]
tempfile.workspace = true
