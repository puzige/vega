[package]
name = "vega_conversation"
version.workspace = true
edition.workspace = true

[features]
# Enables only owned test fixtures to inject a temporary Pi models source.
# Production callers always resolve the fixed `$HOME/.pi/agent/models.json`.
test-support = []

[dependencies]
vega_store = { workspace = true }
vega_runtime = { workspace = true }
vega_tools = { workspace = true }
vega_token = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = { workspace = true }
# threads 表主键 ulid 在本 crate 内生成（T11 裁决：create_thread 内部生成）
ulid = { workspace = true }

portable-pty.workspace = true
vt100.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
