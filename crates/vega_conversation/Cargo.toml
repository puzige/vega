[package]
name = "vega_conversation"
version.workspace = true
edition.workspace = true

[features]
test-support = ["dep:tempfile", "vega_runtime/test-support", "vega_mcp/test-support"]

[dependencies]
tempfile = { workspace = true, optional = true }
vega_store = { workspace = true }
vega_runtime = { workspace = true }
vega_mcp = { workspace = true }
vega_tools = { workspace = true }
vega_token = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
tracing.workspace = true
# threads 表主键 ulid 在本 crate 内生成（T11 裁决：create_thread 内部生成）
ulid = { workspace = true }

portable-pty.workspace = true
vt100.workspace = true
libc.workspace = true

[dev-dependencies]
vega_conversation = { path = ".", features = ["test-support"] }
vega_mcp = { workspace = true, features = ["test-support"] }
vega_runtime = { workspace = true, features = ["test-support"] }
vega_tools = { workspace = true, features = ["test-support"] }
image = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
