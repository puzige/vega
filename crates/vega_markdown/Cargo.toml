[package]
name = "vega_markdown"
version.workspace = true
edition.workspace = true

[dependencies]
vega_i18n.workspace = true
# mdstream 0.3.0（tech-spec §5.0 路线 A）：committed/pending 增量分块；
# `pulldown` feature 启用官方 PulldownAdapter（引用定义 prelude 注入 + invalidated 重解析）
mdstream = { workspace = true, features = ["pulldown"] }
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-sequel = { workspace = true }
