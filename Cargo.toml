[workspace]
resolver = "3"
members = [
    "crates/vega",
    "crates/vega_ui",
    "crates/vega_conversation",
    "crates/vega_runtime",
    "crates/vega_tools",
    "crates/vega_markdown",
    "crates/vega_store",
    "crates/vega_token",
    "crates/vega_theme",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 基础依赖（exec-guide §5 白名单）：版本精确锁定（=x.y.z），crate 内以 `workspace = true` 引用
tokio = "=1.53.1"
serde = "=1.0.229"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
# 数据依赖（exec-guide §5 白名单）：rusqlite 在 vega_store 内启用 `features = ["bundled"]`
rusqlite = "=0.40.2"
# 项目/线程 id（tech-spec §2：projects.id 与 threads.id 均为 ulid，线程 id 由 T11 crate 内生成）
ulid = "=3.0.0"
# 配置解析（exec-guide §5 白名单，2026-08-29 人类批准）
toml = "=1.1.4"
# 网络依赖（exec-guide §5 白名单，2026-08-29 S4-T19 首次激活，版本 cargo info 查最新稳定）：
# reqwest 锁 0.12 线——任务卡指定 features=["rustls-tls","json"] 的 feature 名仅存在于 0.12
# （0.13 已改名 rustls 且默认 TLS 语义变化）；"stream" 为 Response::bytes_stream 所必需
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "=0.2.3"
tokio-util = "=0.7.19"
futures = "=0.3.34"
# 安全依赖（exec-guide §5 白名单）：default feature "v1" 在 macOS 即 Keychain
keyring = "=4.1.6"
# 工具依赖（exec-guide §5 白名单，2026-08-29 T14 spike 确认引入并锁定 0.3.0，
# tech-spec §5.0 路线 A：上游 0.4 已移除 committed/pending+BlockId 模型，禁止随上游升级）
mdstream = "=0.3.0"
pulldown-cmark = "=0.13.4"
# 代码块高亮（exec-guide §5 白名单，2026-08-29 T16 预授权；S3-T16）。
# 架构师裁决（2026-08-29）：四语言 = rust / typescript / javascript / python，
# markdown grammar 砍掉——tree-sitter-markdown 0.7.1 硬依赖 tree-sitter ^0.19，
# 共存会引入第二个 tree-sitter C 运行时导致 SIGSEGV；未来如需走 fork/vendor 路线另议。
# 兼容组合实测：core 0.26.13 接受 ABI 13..=15（LANGUAGE_VERSION=15，MIN=13），
# 四 grammar ABI 依次为 rust 14 / typescript 14 / javascript 15 / python 15，全部落窗。
# tsx 语言由 tree-sitter-typescript 同 crate 提供（零额外依赖）
tree-sitter = "=0.26.13"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
# workspace 内部 crate
vega_store = { path = "crates/vega_store" }
vega_conversation = { path = "crates/vega_conversation" }
vega_theme = { path = "crates/vega_theme" }
vega_ui = { path = "crates/vega_ui" }
vega_markdown = { path = "crates/vega_markdown" }
# 仅供 xtask 使用
anyhow = "=1.0.104"
# 仅供测试使用（dev-dependency）
tempfile = "=3.27.0"
# UI 依赖（exec-guide §5 白名单）：zed 官方仓库 git rev 锁定（phase1-plan E1）；
# 禁第三方发行版、禁混用来源、不开 runtime_shaders；升级须全依赖图同步换 rev
gpui = { git = "https://github.com/zed-industries/zed", rev = "9e9b13c5b6e3d2f1c3819eb8e96b6f8ab5e97aab" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "9e9b13c5b6e3d2f1c3819eb8e96b6f8ab5e97aab", features = ["font-kit"] }
